name: naming-cutover-worker
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Adapt worker to current integration tree
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/naming_cutover_apply.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'files = [ROOT / "README.md", ROOT / "README.ru.md", ROOT / "README.uk.md"]',
              'files = [p for p in (ROOT / "README.md", ROOT / "README.ru.md", ROOT / "README.uk.md") if p.exists()]',
          )
          s = s.replace(
              '        path = ROOT / name\n        text = path.read_text(encoding="utf-8")',
              '        path = ROOT / name\n        if not path.exists():\n            continue\n        text = path.read_text(encoding="utf-8")',
          )
          p.write_text(s, encoding='utf-8')
          PY
      - run: python .github/naming_cutover_apply.py
      - name: Repair installer naming authority for current version module layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('install.py')
          s = p.read_text(encoding='utf-8')
          old = '''META_NAME = "codesleuth.json"\nSETTINGS_NAME = "codesleuth-user.json"\nsys.path.insert(0, str(PACK / "bin"))\nfrom codesleuth_version import source_version  # noqa: E402\nimport codesleuth_project as project_lifecycle  # noqa: E402\nimport codesleuth_tui_core as tui_core  # noqa: E402\n'''
          new = '''sys.path.insert(0, str(PACK / "bin"))\nfrom codesleuth_naming import load_naming  # noqa: E402\nfrom codesleuth_version import source_version  # noqa: E402\nimport codesleuth_project as project_lifecycle  # noqa: E402\nimport codesleuth_tui_core as tui_core  # noqa: E402\n\nNAMING = load_naming(PACK / "codesleuth-naming.json")\nCANONICAL = NAMING["canonical"]\nLEGACY = NAMING["legacy"]\nMETA_NAME = CANONICAL["state"]["metadata"]\nSETTINGS_NAME = CANONICAL["state"]["settings"]\nLEGACY_META_NAME = LEGACY["state"]["metadata"]\nLEGACY_SETTINGS_NAME = LEGACY["state"]["settings"]\n'''
          if old not in s:
              raise SystemExit('installer authority block not found')
          s = s.replace(old, new, 1)
          s = s.replace('args.adopt_existing_pack', 'args.adopt_existing')
          s = s.replace('args.force_pack_files', 'args.force_managed_files')
          if 'legacy_runtime =' not in s:
              raise SystemExit('legacy persistent-state migration block not found')
          managed = '    managed, conflicts = install_files(target, old_meta, args.update, args.force_managed_files, args.adopt_existing)\n'
          bridge = managed + '    if args.update and legacy_runtime:\n        _materialize_legacy_update_bridges(target)\n'
          if '_materialize_legacy_update_bridges(target)' not in s:
              if managed not in s:
                  raise SystemExit('managed-files install seam not found')
              s = s.replace(managed, bridge, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check .
      - name: Commit verified cutover
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: complete CodeSleuth naming cutover'
          git push origin HEAD:chore/codesleuth-naming-cutover
