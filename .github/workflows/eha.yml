name: CodeSleuth EHA

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: Literal numbered release stream to select the candidate from
        required: true
        default: dev/release-0.4.0
        type: string
      expected_sha:
        description: Full 40-character SHA expected at the literal release-stream head
        required: true
        type: string
      scope:
        description: Optional EHA scope note passed to the canonical Playbook
        required: false
        default: SIB0/SIB1/SIB2 exact-head acceptance
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: codesleuth-eha-${{ github.repository }}
  cancel-in-progress: false

jobs:
  eha:
    # The self-hosted runner carries model/provider auth and the durable local
    # evidence store. On this public repository it is never allocated for an
    # untrusted commenter. Manual dispatch is accepted only from main so the
    # bridge/controller source is also pinned to an immutable trusted main SHA.
    if: >-
      github.actor == github.repository_owner &&
      (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          startsWith(github.event.comment.body, '/eha-test ')
        )
      )
    runs-on: [self-hosted, codesleuth-eha]
    timeout-minutes: 180
    env:
      CODESLEUTH_EHA_MODEL: ${{ vars.CODESLEUTH_EHA_MODEL }}

    steps:
      - name: Checkout immutable trusted bridge source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Verify trusted OpenCode host
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          command -v opencode
          python3 --version
          opencode --version
          test -n "${CODESLEUTH_EHA_MODEL:-}"
          opencode models | grep -Fqx "$CODESLEUTH_EHA_MODEL"
          printf 'EHA MODEL %s\n' "$CODESLEUTH_EHA_MODEL"

      - name: Run owner issue-command EHA
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          CODESLEUTH_EHA_REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          persist_root="${CODESLEUTH_EHA_PERSIST_ROOT:-${RUNNER_WORKSPACE}/.codesleuth-eha/${GITHUB_REPOSITORY//\//-}}"
          export CODESLEUTH_EHA_RUNTIME_CONFIG="${persist_root}/bridge-runtime/${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}/opencode-config"
          python3 scripts/eha_github_bridge.py \
            --request "$CODESLEUTH_EHA_REQUEST" \
            --model "$CODESLEUTH_EHA_MODEL" \
            --persist-root "$persist_root"

      - name: Run manually dispatched EHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CODESLEUTH_EHA_RELEASE_BRANCH: ${{ inputs.release_branch }}
          CODESLEUTH_EHA_EXPECTED_SHA: ${{ inputs.expected_sha }}
          CODESLEUTH_EHA_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          persist_root="${CODESLEUTH_EHA_PERSIST_ROOT:-${RUNNER_WORKSPACE}/.codesleuth-eha/${GITHUB_REPOSITORY//\//-}}"
          export CODESLEUTH_EHA_RUNTIME_CONFIG="${persist_root}/bridge-runtime/${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}/opencode-config"
          python3 scripts/eha_github_bridge.py \
            --release-branch "$CODESLEUTH_EHA_RELEASE_BRANCH" \
            --expected-sha "$CODESLEUTH_EHA_EXPECTED_SHA" \
            --scope "$CODESLEUTH_EHA_SCOPE" \
            --model "$CODESLEUTH_EHA_MODEL" \
            --persist-root "$persist_root"
