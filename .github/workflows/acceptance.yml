name: CodeSleuth acceptance

on:
  push:
    branches:
      - main
      - "dev/**"
      - "feature/**"
      - "chore/**"
      - "fix/**"
      - "test/**"
      - "integration/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: codesleuth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CODESLEUTH_ACCEPTANCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CODESLEUTH_ACCEPTANCE_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Verify exact checked-out commit
        run: >-
          python -c "import os, subprocess; expected=os.environ['CODESLEUTH_ACCEPTANCE_SHA']; actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); assert actual == expected, f'acceptance checkout mismatch: expected {expected}, got {actual}'; print(f'EXACT HEAD {actual}')"
      - name: Contributor anti-pattern gate
        run: python scripts/contributor_antipatterns.py scan --strict
      - name: Install acceptance dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q

  tui-visual:
    name: TUI visual regression / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CODESLEUTH_ACCEPTANCE_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact checked-out commit
        run: >-
          python -c "import os, subprocess; expected=os.environ['CODESLEUTH_ACCEPTANCE_SHA']; actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); assert actual == expected, f'acceptance checkout mismatch: expected {expected}, got {actual}'; print(f'EXACT HEAD {actual}')"
      - name: Install acceptance dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare TUI visual artifacts
        run: mkdir -p artifacts/tui-regression
      - name: Run screenshot and log regression analysis
        env:
          CODESLEUTH_UI_VISUAL_REGRESSION: "1"
          CODESLEUTH_UI_ARTIFACT_DIR: artifacts/tui-regression
          TEXTUAL_LOG: artifacts/tui-regression/textual.log
          TEXTUAL_ANIMATIONS: none
        run: python -m pytest -q tests/test_tui_visual_regression.py tests/test_tui_config_contract_controls.py
      - name: Upload TUI visual regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-visual-regression-${{ env.CODESLEUTH_ACCEPTANCE_SHA }}
          path: artifacts/tui-regression/
          if-no-files-found: warn
          retention-days: 14

  bun:
    name: Durable state / context graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CODESLEUTH_ACCEPTANCE_SHA }}
      - name: Verify exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "$CODESLEUTH_ACCEPTANCE_SHA" && echo "EXACT HEAD $CODESLEUTH_ACCEPTANCE_SHA"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - name: Install pinned Bun dependencies
        run: bun install --frozen-lockfile
      - name: Install isolated Mermaid QA runtime
        run: bun install --cwd tools/mermaid-qa --frozen-lockfile
      - name: Verify sandboxed Mermaid QA browser and bind execution identity
        shell: bash
        run: |
          set -euo pipefail
          browser=/usr/bin/google-chrome
          test -x "$browser"
          browser="$(realpath "$browser")"
          node="$(realpath "$(command -v node)")"
          test -x "$node"
          "$browser" --version
          "$node" --version
          profile="$(mktemp -d "$RUNNER_TEMP/codesleuth-chrome.XXXXXX")"
          trap 'rm -rf "$profile"' EXIT
          timeout 30 "$browser" \
            --headless \
            --disable-background-networking \
            --disable-component-update \
            --disable-domain-reliability \
            '--host-resolver-rules=MAP * ~NOTFOUND, EXCLUDE localhost' \
            --no-first-run \
            --user-data-dir="$profile" \
            --dump-dom about:blank >/dev/null
          {
            echo "CODESLEUTH_MERMAID_BROWSER=$browser"
            echo "CODESLEUTH_MERMAID_NODE=$node"
          } >> "$GITHUB_ENV"
      - name: Run durable-state and context-graph smokes
        run: bun run test

  portable-rust:
    name: Portable Rust graph read-side / 1.88
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CODESLEUTH_ACCEPTANCE_SHA }}
      - name: Verify exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "$CODESLEUTH_ACCEPTANCE_SHA" && echo "EXACT HEAD $CODESLEUTH_ACCEPTANCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Verify Rust runtime identity
        run: |
          rustc --version
          cargo --version
          test "$(rustc --version | awk '{print $2}')" = "1.88.0"
      - name: Canonically format portable Rust crate
        run: cargo fmt --manifest-path portable/ebca-graph-readside/Cargo.toml --all
      - name: Upload canonical rustfmt output
        uses: actions/upload-artifact@v4
        with:
          name: portable-rustfmt-${{ env.CODESLEUTH_ACCEPTANCE_SHA }}
          path: portable/ebca-graph-readside/
          if-no-files-found: error
          retention-days: 1
      - name: Lint portable Rust crate
        run: cargo clippy --manifest-path portable/ebca-graph-readside/Cargo.toml --all-targets -- -D warnings
      - name: Test portable Rust crate
        run: cargo test --manifest-path portable/ebca-graph-readside/Cargo.toml

  graphify-enabled:
    name: Graphify enabled runtime / Python 3.12 / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CODESLEUTH_ACCEPTANCE_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify exact checked-out commit
        run: >-
          python -c "import os, subprocess; expected=os.environ['CODESLEUTH_ACCEPTANCE_SHA']; actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); assert actual == expected, f'acceptance checkout mismatch: expected {expected}, got {actual}'; print(f'EXACT HEAD {actual}')"
      - name: Contributor anti-pattern gate
        run: python scripts/contributor_antipatterns.py scan --strict
      - name: Install acceptance dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: oven-sh/setup-bun@v2
      - name: Install pinned Bun dependencies
        run: bun install --frozen-lockfile
      - name: Install hash-locked Graphify runtime through lifecycle authority
        env:
          PYTHONPATH: pack/.opencode/bin
        run: python -m codesleuth_project --install-graphify-runtime .
      - name: Run enabled provider and semantic corpus acceptance
        run: |
          python -m pytest -q tests/test_graphify_adapter.py tests/test_graphify_corpus.py
          python scripts/graphify_corpus_compare.py --fixtures tests/fixtures/graphify-corpus --check
          bun tests/context_graph_provider_smoke.ts
