name: CodeSleuth acceptance

on:
  push:
    branches:
      - main
      - "dev/**"
      - "feature/**"
      - "chore/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: codesleuth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install acceptance dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q

  bun:
    name: Durable state / context graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Install pinned Bun dependencies
        run: bun install --frozen-lockfile
      - name: Run durable-state and context-graph smokes
        run: bun run test
