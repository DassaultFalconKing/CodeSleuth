name: Obsidian adapter

on:
  pull_request:
    paths:
      - "tools/obsidian-adapter/**"
      - "docs/OBSIDIAN-ADAPTER.md"
      - "docs/superpowers/specs/2026-09-02-portable-obsidian-adapter-design.md"
      - "docs/superpowers/plans/2026-09-02-portable-obsidian-adapter.md"
      - ".github/workflows/obsidian-adapter.yml"
  push:
    branches:
      - "feature/portable-obsidian-adapter"
    paths:
      - "tools/obsidian-adapter/**"
      - "docs/OBSIDIAN-ADAPTER.md"
      - ".github/workflows/obsidian-adapter.yml"

jobs:
  python-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pip install -e tools/obsidian-adapter
      - run: pytest -q tools/obsidian-adapter/tests

  obsidian-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/obsidian-adapter/obsidian-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
